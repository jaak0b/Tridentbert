[gcode_macro PRINT_START]
description: Beacon contact print start (sequence from Beacon docs, Contact 5.3) with motors-sync after heat soak
variable_probe_temp: 150          # Beacon docs: probe at reduced nozzle temp (must stay below contact_max_hotend_temperature)
variable_soak_minutes: 10         # full soak from a cold printer (2 min if the bed is already hot)
variable_settle_minutes: 1        # Beacon docs: let temps settle with Beacon at 2mm before contact
variable_expansion_offset: 0.12   # Beacon docs: hotend thermal expansion offset, starting value - tune it
variable_sync_z: 200               # nozzle Z during soak + SYNC_MOTORS - keeps the Beacon accelerometer away from the hot bed (shuts off >102.5C)
variable_soak_fan: 0.5            # part fan during heat soak (40%) to circulate chamber air
variable_chamber_margin: 5        # continue once chamber >= target - margin
gcode:
    {% set bedtemp = params.BED|default(60)|int %}
    {% set hotendtemp = params.HOTEND|default(220)|int %}
    {% set material = params.FILAMENT_TYPE|default("")|string %}   # passed by Orca, not used yet
    {% set chambertemp = params.CHAMBER_TEMP|default(0)|int %}      # passed by Orca, not used until chamber hardware is installed
    # bed already hot at start = back-to-back print, frame is already warm
    {% set bed_was_hot = printer.heater_bed.temperature >= bedtemp - 5 %}
    {% set chamber_now = printer["heater_generic chamber_heater"].temperature %}
    {% set chamber_was_hot = chambertemp == 0 or chamber_now >= chambertemp - chamber_margin %}
    {% set SOAK = params.SOAK|default(2 if (bed_was_hot and chamber_was_hot) else soak_minutes)|float %}

    _SET_MPC_MATERIAL MATERIAL={material}
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    G90                                   # absolute positioning
    M83                                   # relative extrusion

    # Beacon refuses contact homing above contact_max_hotend_temperature -> cool down first
    {% set contact_max = printer.configfile.settings.beacon.contact_max_hotend_temperature|float %}
    {% if printer.extruder.temperature > contact_max - 5 %}
        M117 Cooling nozzle for contact homing
        RESPOND MSG="Nozzle {printer.extruder.temperature|round(1)}C - cooling below {contact_max - 5}C before homing"
        M104 S{probe_temp}                # target = probing temp, so it does not cool all the way down
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={contact_max - 5}
    {% endif %}

    G28                                   # home all axes
    G0 Z{sync_z} F600                     # Beacon away from the bed during soak + sync

    {% if chambertemp > 0 %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={chambertemp}
        M106 S{(soak_fan * 255)|int}      # circulate chamber air while heating
    {% endif %}

    # heat soak - nozzle heats to probing temp together with the bed
    # (motors-sync wiki: hotend heating during sync not recommended - if sync results are poor, add M104 S0 before SYNC_MOTORS)
    M104 S{probe_temp}                    # nozzle to probing temp, no wait
    M140 S{bedtemp}                       # start bed heating now - helps heat the chamber
    {% if chambertemp > 0 %}
        M117 Heating chamber to {chambertemp}C
        RESPOND MSG="Waiting for chamber: {chambertemp}C"
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={chambertemp - chamber_margin}
    {% endif %}

    M190 S{bedtemp}                       # wait for bed temperature
    {% if SOAK > 0 %}
        M117 Heat soak {SOAK} min
        RESPOND MSG="Heat soak: {SOAK} min"
        G4 P{(SOAK * 60000)|int}
    {% endif %}

    M107                                  # fan off: running fans disturb motors-sync measurement
    SYNC_MOTORS

    # Beacon to 2mm, nozzle to probing temp, let temps settle (Beacon docs)
    G0 Z2 F600
    M109 S{probe_temp}                    # wait until nozzle is at probing temp (also cools down if hotter)
    {% if settle_minutes > 0 %}
        RESPOND MSG="Beacon settle: {settle_minutes} min"
        G4 P{(settle_minutes * 60000)|int}
    {% endif %}

    CLEAN_NOZZLE
    G28 Z METHOD=CONTACT CALIBRATE=1      # calibrate z offset and Beacon model hot
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE RUNS=2 ADAPTIVE=1  # scan mesh, only the print area
    CLEAN_NOZZLE
    G28 Z METHOD=CONTACT CALIBRATE=0      # z offset only, after tilt/mesh

    {% if chambertemp > 0 %}
        M106 S{(soak_fan * 255)|int}      # chamber print: circulate chamber air during soak
    {% endif %}

    SMART_PARK                            # KAMP: park near the print area before final heating
    M104 S{hotendtemp}                    # extruder to print temp
    M109 S{hotendtemp}                    # wait for extruder temp
    SET_GCODE_OFFSET Z={expansion_offset} # compensate hotend thermal expansion

    LINE_PURGE                            # KAMP adaptive purge line
    M107

[gcode_macro PRINT_END]
description: Retract, heaters off, park at the back
variable_retract: 5               # keep KAMP variable_tip_distance similar to this (KAMP_Settings.cfg)
gcode:
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    M400                                  # wait for moves to finish
    M83
    G1 E-{retract} F1800                  # retract
    TURN_OFF_HEATERS
    M107                                  # part fan off
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    G90
    G0 Z{z_safe} F3600                    # move nozzle away from the print
    G0 X{th.axis_maximum.x / 2} Y{th.axis_maximum.y - 10} F6000   # park centre-back

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}    
        {% endif %}
      
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=300                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning

        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 E{e} F900      
        {% endif %}
       
        CLEAN_NOZZLE

        G1 Z{zhop * -1} F900  ; lower Z back down

        RESTORE_GCODE_STATE NAME=PAUSE ;MOVE=1 MOVE_SPEED=300                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    #SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro CLEAN_NOZZLE]
description: Wipe the nozzle over the brush. Disabled until the brush position is measured.
variable_enabled: True
variable_x_start: 229             # brush right end
variable_x_end: 200               # brush left end (3 cm brush)
variable_y: 288                   # brush centre line in Y
variable_y_wiggle: 1              # side-to-side zigzag in Y (+/- mm around y), 0 = straight strokes. y + y_wiggle must stay <= Y max (293)
variable_safe_z: 10               # brush is fixed to the frame: only lower the bed to at least this Z so nothing collides
variable_wipes: 6
gcode:
    {% if not enabled %}
        RESPOND MSG="CLEAN_NOZZLE skipped: brush position not configured yet"
    {% else %}
        SAVE_GCODE_STATE NAME=CLEAN_NOZZLE
        G90
        {% if printer.toolhead.position.z < safe_z %}
            G0 Z{safe_z} F3600            # move the bed down for clearance (never up)
        {% endif %}
        G0 X{x_start} Y{y} F18000
        {% for i in range(wipes) %}
            G0 X{x_end} Y{y + y_wiggle} F18000    # diagonal stroke to one side
            G0 X{x_start} Y{y - y_wiggle} F18000  # and back to the other side
        {% endfor %}
        RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE MOVE=1 MOVE_SPEED=300
    {% endif %}



[gcode_macro Force_Lower_Bed]
gcode:
    {% set zChange = params.zChange|default(20)|int %}
    G90
    SET_KINEMATIC_POSITION Z=0 X=150 Y=150
    G0  Z{zChange} F5000
    M84

[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x %}
        {% if x_min < 0 %}
            {% set x_min = 0 %}
        {% endif %}
    
        {% set y_min = printer.toolhead.axis_minimum.y %}
        {% if y_min < 0 %}
            {% set y_min = 0 %}
        {% endif %}
    
        {% set x_min = x_min + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = y_min + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro GET_VARIABLE]
description: Usage: GET_VARIABLE NAME=bed_mesh.profiles.default.points.1.0: Returns value and type of variable printer.bed_mesh.profiles.default.points[1][0].

gcode:
    {% set names = (params.NAME).split('.')|list %}
    {% set join = (params.JOIN)|default(1)|int %}
    
    {% set _dummy0 = namespace( break = 0 ) %}
    {% set _dummy1 = namespace( out = printer[names|first] ) %}
    
    {% for name in names if _dummy0.break == 0 %}
        {% if loop.index > 1 %}
            {% if name in _dummy1.out %}
                {% set _dummy1.out = _dummy1.out[name] %}
            {% elif name[0] in '0123456789' and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping and _dummy1.out|length > name[0]|int %}
                {% set _dummy1.out = _dummy1.out[name|int] %}
            {% else %}
                {% set _dummy0.break = loop.index0 %}
            {% endif %}
        {% endif %}
    {% endfor %}
    
    {% if _dummy1.out is boolean %}
        { action_respond_info('Type: boolean') }
    {% elif _dummy1.out is float %}
        { action_respond_info('Type: float') }
    {% elif _dummy1.out is integer %}
        { action_respond_info('Type: integer') }
    {% elif _dummy1.out is mapping %}
        { action_respond_info('Type: mapping') }
    {% elif _dummy1.out is string %}
        { action_respond_info('Type: string') }
    {% elif _dummy1.out is iterable %}
        { action_respond_info('Type: iterable') }
    {% elif _dummy1.out is none %}
        { action_respond_info('Type: none') }
    {% elif _dummy1.out is undefined %}
        { action_respond_info('Type: undefined') }
    {% elif _dummy1.out is callable %}
        { action_respond_info('Type: callable') }
    {% else %}
        { action_respond_info('Type: unknown') }
    {% endif %}
    
    {% if join and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping %}
        { action_respond_info('%s' % _dummy1.out|join("\n")) }
    {% else %}
        { action_respond_info('%s' % _dummy1.out) }
    {% endif %}
    
    {% if _dummy0.break != 0 %}
        { action_respond_info('"printer.%s" does not contain "%s"!' % (names[0:_dummy0.break]|join('.'), names[_dummy0.break])) }
    {% endif %}

[gcode_macro DUMP_VARIABLES]
description: This helps to find Klipper system variables for use in macros. A filter for both name and value can be applied.
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}

