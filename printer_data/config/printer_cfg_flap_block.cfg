#   ---- Flap mode (plugin ~/klipper/klippy/plugins/cpap_flap.py) ----
#   PRINT_START runs _CPAP_MODE ACTIVE=0 (safety) and CPAP_SCAN (highest
#   part-fan speed of the file), at its end _CPAP_MODE ACTIVE=1: the blower
#   then runs constant at that speed and every M106/M107 only moves the flap.
#   PRINT_END (and so CANCEL_PRINT) starts with _CPAP_MODE ACTIVE=0.
#   Scaling, ON PURPOSE: flap mode treats the slicer's S/255 as real blower
#   PWM and bypasses the min_power rescale of fan.py (_CPAP_MODE sends the
#   fan value whose PWM equals fan_max, the flap share is S/255 / that PWM).
#   The Orca profiles and the MPC fan table were tuned before min_power 0.2
#   was added (2026-10-19). Outside flap mode, M106 is the plain Kalico
#   command and rescales: PWM = 0.2 + 0.8 * S/255.
[cpap_flap]
#   also MPC's cooling fan: [extruder] cooling_fan: cpap_flap
#   (reports blower PWM power * flap toolhead share as "speed")
#timeout: 60
#fan: fan
#servo: cpap_flap

[gcode_macro _CPAP_MODE]
description: Flap mode. ACTIVE=1 blower constant at printer.cpap_flap.fan_max (CPAP_SCAN first), M106/M107 only move the flap. ACTIVE=0 normal fan
variable_active: False
variable_blower: 0.0
gcode:
    {% if params.ACTIVE|default(0)|int == 1 %}
        {% set fan = printer.configfile.settings.fan %}
        {% set minp = (fan.min_power or 0.0)|float %}
        {% set maxp = (fan.max_power or 1.0)|float %}
        {% set scan = printer.cpap_flap %}
        {% set fan_max = scan.fan_max|float %}
        {% if fan_max > 0 %}
            # Kalico fan.py: power = min_power + value * (max_power - min_power) for value > 0
            # -> send the value whose power equals fan_max (never below min_power)
            {% set target = [[fan_max, minp]|max, maxp]|min %}
            {% set value = ((target - minp) / (maxp - minp)) if maxp > minp else 1.0 %}
            {% set value = [value, 0.0001]|max %}
            {% set blower = minp + value * (maxp - minp) %}
        {% else %}
            {% set value = 0.0 %}
            {% set blower = 0.0 %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=blower VALUE={blower}
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=active VALUE=True
        CPAP_FLAP PERCENT=0
        M106.1 S{'%.3f' % (value * 255)}
        RESPOND MSG="CPAP flap mode ON: file max {'%.1f' % (fan_max * 100)} %, blower power {'%.1f' % (blower * 100)} %{'' if scan.valid else ' (FAIL SAFE - no valid CPAP_SCAN)'}, flap 0 % until the first M106"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=active VALUE=False
        SET_GCODE_VARIABLE MACRO=_CPAP_MODE VARIABLE=blower VALUE=0.0
        M107.1
        CPAP_FLAP PERCENT=100
        RESPOND MSG="CPAP flap mode OFF: blower off, flap 100 % toolhead"
    {% endif %}

[gcode_macro M106]
rename_existing: M106.1
description: Part fan. Flap mode: only moves the flap (toolhead share = S/255 / blower power), otherwise the normal M106
gcode:
    {% set mode = printer["gcode_macro _CPAP_MODE"] %}
    {% if not mode.active %}
        M106.1 {rawparams}
    {% elif params.P|default(0)|int == 0 %}
        # M106 P1/P2/P3 (aux/exhaust fans) are ignored in flap mode, like in CPAP_SCAN
        {% set wanted = [[params.S|default(255)|float / 255, 0.0]|max, 1.0]|min %}
        {% set pct = ([wanted / mode.blower, 1.0]|min * 100) if mode.blower > 0 else 100 %}
        CPAP_FLAP PERCENT={'%.1f' % pct}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
description: Part fan off. Flap mode: flap to 0 % toolhead (blower keeps running), otherwise the normal M107
gcode:
    {% if printer["gcode_macro _CPAP_MODE"].active %}
        M106 S0
    {% else %}
        M107.1
    {% endif %}

#   MPC calibration of the extruder with blower + flap prepared. Refuses up
#   front in flap mode or during a print (otherwise the plugin would only
#   refuse after minutes of heating). Extra parameters go to MPC_CALIBRATE,
#   default FAN_BREAKPOINTS=11. Works with cooling_fan: fan and cpap_flap.
#   If MPC_CALIBRATE fails or is aborted, this macro stops too: run
#   _CPAP_MPC_END by hand (fan off, flap 100 %, FAN_ON_WITH_HEATER re-armed),
#   MPC itself already sets the hotend target to 0.
[gcode_macro CPAP_MPC_CALIBRATE]
description: MPC_CALIBRATE HEATER=extruder with flap mode off, part fan off, flap 100 % and FAN_ON_WITH_HEATER paused. Default FAN_BREAKPOINTS=11
gcode:
    {% if printer["gcode_macro _CPAP_MODE"].active %}
        { action_raise_error("CPAP_MPC_CALIBRATE: flap mode is active - run _CPAP_MODE ACTIVE=0 first") }
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("CPAP_MPC_CALIBRATE: not while a print is " ~ printer.print_stats.state) }
    {% endif %}
    {% if params.HEATER|default("extruder")|lower != "extruder" %}
        { action_raise_error("CPAP_MPC_CALIBRATE: only for HEATER=extruder - use MPC_CALIBRATE for other heaters") }
    {% endif %}
    {% set args = [] %}
    {% for key in params %}
        {% if key != "HEATER" %}
            {% set dummy = args.append("%s=%s" % (key, params[key])) %}
        {% endif %}
    {% endfor %}
    {% if "FAN_BREAKPOINTS" not in params %}
        {% set dummy = args.append("FAN_BREAKPOINTS=11") %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=FAN_ON_WITH_HEATER DURATION=0
    M107
    CPAP_FLAP PERCENT=100
    RESPOND MSG="CPAP_MPC_CALIBRATE: fan off, flap 100 %, FAN_ON_WITH_HEATER paused - MPC_CALIBRATE HEATER=extruder {args|join(' ')}"
    MPC_CALIBRATE HEATER=extruder {args|join(' ')}
    _CPAP_MPC_END
    RESPOND MSG="CPAP_MPC_CALIBRATE done - check the values above, then SAVE_CONFIG"

[gcode_macro _CPAP_MPC_END]
description: After CPAP_MPC_CALIBRATE (run by hand after an aborted calibration): part fan off, flap 100 %, FAN_ON_WITH_HEATER re-armed
gcode:
    M107
    CPAP_FLAP PERCENT=100
    UPDATE_DELAYED_GCODE ID=FAN_ON_WITH_HEATER DURATION=5
    RESPOND MSG="CPAP: part fan off, flap 100 %, FAN_ON_WITH_HEATER re-armed"
