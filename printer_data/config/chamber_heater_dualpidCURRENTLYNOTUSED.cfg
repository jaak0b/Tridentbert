#####################################################################
#   Chamber heater - Kalico dual_loop_pid
#   outer loop: chamber air (mean of chamber thermistors)
#   inner loop: PTC fin thermistor - limits the heater (co = min(outer, inner))
#
#   ORDER MATTERS: [temperature_sensor chamber_heater_fins] must stay
#   ABOVE [heater_generic chamber_heater] (Kalico looks it up when the
#   heater is created).
#####################################################################

# --- PTC fin thermistor (inner loop / safety) ----------------------
[temperature_sensor chamber_heater_fins]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF6
min_temp: 0                       # open/broken thermistor -> shutdown
max_temp: 120       # hard MCU limit: thermal fuse rating - 10 C

# --- Chamber air thermistors (on the "therm" MCU) ------------------
[temperature_sensor chamber_top_front_left]
sensor_type: Generic 3950
sensor_pin: therm:PA4
min_temp: 0
max_temp: 120

[temperature_sensor chamber_top_front_right]
sensor_type: Generic 3950
sensor_pin: therm:PA3
min_temp: 0
max_temp: 120

[temperature_sensor chamber_top_back_left]
sensor_type: Generic 3950
sensor_pin: therm:PA2
min_temp: 0
max_temp: 120

[temperature_sensor chamber_top_back_right]
sensor_type: Generic 3950
sensor_pin: therm:PA1
min_temp: 0
max_temp: 120

[temperature_sensor chamber_bottom_front_left]
sensor_type: Generic 3950
sensor_pin: therm:PA7
min_temp: 0
max_temp: 120

[temperature_sensor chamber_bottom_front_right]
sensor_type: Generic 3950
sensor_pin: therm:PA0
min_temp: 0
max_temp: 120

[temperature_sensor chamber_bottom_back_left]
sensor_type: Generic 3950
sensor_pin: therm:PB0
min_temp: 0
max_temp: 120

[temperature_sensor chamber_bottom_back_right]
sensor_type: Generic 3950
sensor_pin: therm:PB1
min_temp: 0
max_temp: 120

# --- Chamber heater ------------------------------------------------
[heater_generic chamber_heater]
heater_pin: PB10                  # HE2 on Octopus Pro V1.0
max_power: 1.0
sensor_type: temperature_combined
sensor_list: temperature_sensor chamber_top_front_left, temperature_sensor chamber_top_front_right, temperature_sensor chamber_top_back_left, temperature_sensor chamber_top_back_right, temperature_sensor chamber_bottom_front_left, temperature_sensor chamber_bottom_front_right, temperature_sensor chamber_bottom_back_left, temperature_sensor chamber_bottom_back_right
combination_method: mean
maximum_deviation: 999            # top/bottom differ a lot while heating (as in the old config)
min_temp: 0
max_temp: 90                      # hard limit for chamber AIR (old config: 130)
control: dual_loop_pid
# outer loop (chamber air) - start values from the old single-loop PID, replaced by PID_CALIBRATE
pid_Kp: 70.184
pid_Ki: 0.376
pid_Kd: 3274.071
# inner loop (PTC fins)
inner_sensor_name: chamber_heater_fins
inner_target_temp: 110   # fins are held at or below this: thermal fuse rating - 20 C
# placeholder start values, replaced by PID_CALIBRATE (calibrates inner loop first)
inner_pid_Kp: 20.0
inner_pid_Ki: 0.5
inner_pid_Kd: 100.0

[verify_heater chamber_heater]
max_error: 480                    # values from the old config (slow chamber heating)
check_gain_time: 300
hysteresis: 30
heating_gain: 0.1

# --- Heater fans on the BED output (separate 12 V supply on the bed input) ---
[controller_fan chamber_heater_fan]
pin: PA1                          # BED output, Octopus Pro V1.0
heater: chamber_heater
stepper:                          # watch no steppers, only the heater
fan_speed: 1.0                    # full on/off - no PWM on an inductive load
max_power: 1.0
kick_start_time: 0.5
idle_timeout: 120                 # keep cooling the PTC fins for 2 min after the heater turns off
