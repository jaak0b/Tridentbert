#[include mainsail.cfg]
[include macro.cfg]
[include Line_Purge.cfg]
[include KAMP_Settings.cfg]
[include Smart_Park.cfg]
[include TEST_SPEED.cfg]
[include config_backup.cfg]
[include macro_thermal_expansion_compensation.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_440035001550535556323420-if00
restart_method: command

[mcu therm]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_048021000F4330344E333720-if00
restart_method: command
#####################################################################
#   Extruder
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[respond]

[auto_speed]

[save_variables]
filename: ~/printer_data/config/variables.txt

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_z_velocity: 15
max_z_accel: 45
square_corner_velocity: 6.0

[extruder]
enable_pin: !PE0
step_pin: PE6
dir_pin: PA14                                                      # Add ! if moving opposite direction
full_steps_per_rotation: 200                                       # Set to 200 for LDO 1.8° stepper motor, and set to 400 for OMC(StepperOnline) 0.9° stepper motor

#wwbmg
rotation_distance:  22.23
gear_ratio: 50:10

#G2A
#rotation_distance:  47.088                                           # See calibrating rotation_distance on extruders doc
#gear_ratio: 9:1                                                    # For Mini Afterburner

microsteps: 16


nozzle_diameter: 0.500
filament_diameter: 1.750

heater_pin: PA2                                                  
sensor_type: PT1000    

sensor_pin: therm:PA5
min_temp: 0
max_temp: 340375333.71
min_extrude_temp: 170
max_extrude_only_distance: 300
pressure_advance: 0.028
pressure_advance_smooth_time: 0.020000
max_extrude_cross_section: 50

#heater_power: 120
# MPC settings
#control: mpc
#cooling_fan: fan
#filament_diameter: 1.75
#filament_density: 1.20
#filament_heat_capacity: 1.8 

#control: pid
#pid_kp: 55.642
#pid_ki: 3.041
#pid_kd: 254.560
#pid_version: 1
#pid_target: 105.00
#pid_tolerance: 0.0200

#[verify_heater extruder]
#max_error: 120 # double if needed
#check_gain_time: 60 #default for extruder is 20, 60 for bed heater. increase for weak heaters. 
#hysteresis: 5 #default is 5, this is the maximum allowable deviation from setpoint. increase during PID tuning. 
#heating_gain: 1.5 #default is 2. increase this for very fast heaters, decrease this for weak ones.

[tmc2240 extruder]
cs_pin: PD3
spi_bus: spi1
interpolate: False
run_current: 0.6
stealthchop_threshold: 0       
rref: 12000

#####################################################################
#   Motors
#####################################################################

# Driver3
[stepper_x1]
enable_pin: !PA0
step_pin: PG4
dir_pin: PC1
microsteps: 16
rotation_distance: 40

[tmc2240 stepper_x1]
cs_pin: PC7
spi_bus: spi1
rref: 12000
run_current: 1.7
stealthchop_threshold: 0


# Driver4
[stepper_x]
enable_pin: !PG2
step_pin: PF9
dir_pin: PF10
microsteps: 16
rotation_distance: 40

endstop_pin: tmc2240_stepper_x:virtual_endstop
position_endstop: 300
position_max: 300
homing_speed: 100
homing_retract_dist: 200
min_home_dist: 40
homing_positive_dir: true
use_sensorless_homing: true

[tmc2240 stepper_x]
cs_pin: PF2
spi_bus: spi1
rref: 12000
stealthchop_threshold: 0
run_current: 1.7

home_current: 0.5
diag0_pin: ^!PG12
#driver_SGT: 3

# Driver5
[stepper_y1]
enable_pin: !PF1
step_pin: PC13
dir_pin: PF0
microsteps: 16
rotation_distance: 40

[tmc2240 stepper_y1]
cs_pin: PE4
spi_bus: spi1
rref: 12000
stealthchop_threshold: 0
run_current: 1.7


# Driver6
[stepper_y] 
enable_pin: !PD4
step_pin: PE2
dir_pin: PE3
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_endstop: 267
position_max: 267
homing_speed: 100
homing_retract_dist: 60
min_home_dist: 40
homing_positive_dir: true
use_sensorless_homing: true

[tmc2240 stepper_y]
cs_pin: PE1
spi_bus: spi1
rref: 12000
stealthchop_threshold: 0
run_current: 1.7

home_current: 0.5
diag0_pin: ^!PG14
#driver_SGT: 3

# Driver0
[stepper_z]
enable_pin: !PF14
step_pin: PF13
dir_pin: !PF12
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 00
position_max: 250
position_min: -5

[tmc2240 stepper_z]
cs_pin: PC4
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

# Driver1
[stepper_z1]
enable_pin: !PF15
step_pin: PG0
dir_pin: !PG1
microsteps: 16
rotation_distance: 8
endstop_pin: PG10

[tmc2240 stepper_z1]
cs_pin: PD11
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

# Driver2
[stepper_z2]
enable_pin: !PG5
step_pin: PF11
dir_pin: !PG3
microsteps: 16
rotation_distance: 8

[tmc2240 stepper_z2]
cs_pin: PC6
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

[autotune_tmc stepper_x]
motor: omc-17hs19-2504s-h
sgt: 4
voltage: 36

[autotune_tmc stepper_x1]
motor: omc-17hs19-2504s-h
voltage: 36

[autotune_tmc stepper_y]
motor: omc-17hs19-2504s-h
sgt: 5
voltage: 36

[autotune_tmc stepper_y1]
motor: omc-17hs19-2504s-h
voltage: 35

#####################################################################
#   Bed Mesh + Probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_7A4B73935154354D38202020FF0A1731-if00
is_non_critical: True
home_method: contact
home_method_when_homed: contact
home_autocalibrate: unhomed
x_offset: -23
y_offset: 0
mesh_main_direction: x
mesh_runs: 2
speed: 3000
lift_speed: 250
home_xy_position: 140,140 ; Also change the position in zero_reference_position
home_xy_move_speed: 300
home_z_hop_speed: 50
home_z_hop: 15
home_y_before_x: true
contact_max_hotend_temperature: 175

[bed_mesh]
speed: 400
horizontal_move_z: 15
mesh_min: 35, 35
mesh_max: 230, 230
probe_count: 25, 25
mesh_pps: 3, 3 #specifies how many points to interpolate for each segment along the X and Y axes
algorithm: bicubic
zero_reference_position: 140,140 ; Also change the value in beacon -> home_xy_position

[z_tilt]
z_positions:
   -50, 18
   150, 348
   350, 18
points:
   30, 5
   150, 212
   270, 5
speed: 200
horizontal_move_z: 20

adaptive_horizontal_move_z: True

retries: 5
retry_tolerance: 0.01
use_probe_xy_offsets: true


  
#####################################################################
#   Resonance
#####################################################################

[input_shaper]
shaper_freq_x: 134.2
#shaper_type_x: ei
damping_ratio_x: 0.038

shaper_freq_y: 78
#shaper_type_y: ei
damping_ratio_y: 0.039

shaper_type: ei

[shaketune]

[resonance_tester]
accel_chip: beacon
probe_points: 150, 150, 20
accel_per_hz: 120
sweeping_accel: 400
sweeping_period: 0
max_freq: 200

[motors_sync]
axes: x,y
#    Axes on which calibration will be performed.
accel_chip: beacon
#    Accelerometer for vibrations collection: adxl345 / mpu9250 etc.
#encoder_chip_<axis>:
#    Axis, assigned encoder name, for measuring deviations.
#chip_filter: median
#    Filter type for data from the accelerometer: 'median' works well in
#    most cases, but some particularly noisy printers (fans, etc.) may
#    require a more powerful filter - 'kalman'. On lis2dw filters disabled.
#median_size: 3
#    Median filter window size.
#kalman_coeffs: 1.1, 1., 1e-1, 1e-2, .5, 1.
#    Simple coefficients describing the kalman filter.
#microsteps: 16
#    Maximum microstepping displacement of the stepper motor rotor.
#sync_method: default
#    Methods for synchronizing two axes on interconnected kinematics:
#    'alternately' - the axes calibrated alternately, step by step. (default)
#    'synchronous' - the axes calibrated depending on their magnitude,
#    trying to keep it at the same level.
#    Methods for synchronizing axis/axes on NOT-interconnected kinematics:
#    'sequential' - axes are calibrated sequentially. (default)
#steps_model: linear, 20000, 0
#    Mathematical model and its coefficients representing the dependence
#    of stepper motor microstep displacement on the measured magnitude.
#max_step_size: 3
#    The maximum number of microsteps that the motor can take move at time,
#    to achieve the planned magnitude.
#axes_steps_diff: 4
#    The difference in the positions of the motors in microsteps between
#    the two axes, to update the magnitude of the secondary axis. It is
#    used in the synchronous method, or in the process of axis alignment
#    in the alternately method. The typical value is max_step_size + 1.
#retry_tolerance: 0
#    The forced threshold to which a pair of stepper motors on one belt
#    will have to lower the magnitude of the oscillations. It's recommended
#    to configure in order to filter possible inaccuracies. After several
#    iterations of starting synchronization, you will find the edge, to
#    which this parameter should be omitted.
#retries: 0
#    The maximum number of repetitions to achieve the forced threshold of
#    oscillations.
#head_fan:
#    Toolhead fan, which will be turned off during sync to eliminate noise.

#####################################################################
#   Fans
#####################################################################

[fan]
pin: !PA8
kick_start_time: 0.5
enable_pin: PE5
#hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
off_below: 0.13

[multi_pin tmc_fans] 
pins: PD12, PD13

[controller_fan tmc_fan]
pin: multi_pin: tmc_fans
max_power: 1
shutdown_speed: 0.0
kick_start_time: 5.0
stepper: stepper_x, stepper_x1, stepper_y, stepper_y1, stepper_z, stepper_z1, stepper_z2, extruder

[controller_fan chamber_heater_fan]
pin: PA1
heater: chamber_heater
kick_start_time: 0.5   
max_power: 1
idle_timeout: 60
stepper:

#####################################################################
#   Heaters
#####################################################################


##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA3
##  Validate the following thermistor type to make sure it is correct
##  Keenovo branded bed heaters should use Generic 3950
##  LDO branded bed heaters will have the sensor type labelled on the heater
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF7
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 1
min_temp: -100
max_temp: 120


[heater_generic chamber_heater]
heater_pin: PB10
max_power: 1

sensor_type: temperature_combined
sensor_list: temperature_sensor chamber_bottom_front_left, temperature_sensor chamber_top_front_right, temperature_sensor chamber_top_front_left, temperature_sensor chamber_top_back_right, temperature_sensor chamber_top_back_left, temperature_sensor chamber_bottom_back_richt, temperature_sensor chamber_bottom_back_left #, temperature_sensor chamber_bottom_front_right
combination_method: mean
maximum_deviation: 999

#sensor_type: ATC Semitec 104NT-4-R025H42G 
#sensor_pin: PF6

min_temp: 0
max_temp: 130
control: pid
pid_Kp: 70.184
pid_Ki: 0.376
pid_Kd: 3274.071

[verify_heater chamber_heater]
max_error: 480 # double if needed
check_gain_time: 300 #default for extruder is 20, 60 for bed heater. increase for weak heaters. 
hysteresis: 30 #default is 5, this is the maximum allowable deviation from setpoint. increase during PID tuning. 
heating_gain: 0.1 #default is 2. increase this for very fast heaters, decrease this for weak ones.

#####################################################################
#   Thermistors
#####################################################################

[temperature_sensor ptc_core_lower]
sensor_type: ATC Semitec 104NT-4-R025H42G 
sensor_pin: PF6

[temperature_sensor ptc_core_upper]
sensor_type: Generic 3950
sensor_pin: PF4

[temperature_sensor chamber_bottom_front_right]
sensor_type: Generic 3950
sensor_pin: therm:PA0

[temperature_sensor chamber_bottom_front_left]
sensor_type: Generic 3950
sensor_pin: therm:PA7

[temperature_sensor chamber_bottom_back_richt]
sensor_type: Generic 3950
sensor_pin: therm:PB1

[temperature_sensor chamber_bottom_back_left]
sensor_type: Generic 3950
sensor_pin: therm:PB0

[temperature_sensor chamber_top_front_right]
sensor_type: Generic 3950
sensor_pin: therm:PA3

[temperature_sensor chamber_top_front_left]
sensor_type: Generic 3950
sensor_pin: therm:PA4

[temperature_sensor chamber_top_back_right]
sensor_type: Generic 3950
sensor_pin: therm:PA1

[temperature_sensor chamber_top_back_left]
sensor_type: Generic 3950
sensor_pin: therm:PA2

#####################################################################
#   filament runout
#####################################################################

[filament_switch_sensor filament_sensor]
switch_pin: ^PG6
pause_on_runout: False
runout_gcode:
 PAUSE # [pause_resume] is required in printer.cfg
 M117 Filament switch runout
insert_gcode:
 M117 Filament switch inserted

