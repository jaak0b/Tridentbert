# Trimmed snapshot of the live macro.cfg of the Trident (Moonraker GET
# http://trident.local:7125/server/files/config/macro.cfg on 2026-10-19).
# Only the sections tests/sim_macros.py uses, copied verbatim (file lines 441-445, 447-457).

[delayed_gcode FAN_ON_WITH_HEATER]
initial_duration: 1
gcode:
    PC_HOTEND
    UPDATE_DELAYED_GCODE ID=FAN_ON_WITH_HEATER DURATION=5 #Re-checks every 5 seconds

[gcode_macro PC_HOTEND]
gcode:
    {% set he_temp = printer[printer.toolhead.extruder].temperature|float %}
    
    {% if he_temp > 50 and printer.fan.speed == 0 %}
        M106 S55  # Set fan speed to 21% if hotend temp is above 50c and fan is 0%
    {% endif %}

    {% if he_temp < 48 and printer.fan.speed < 15 %}
        M106 S0  # Set fan speed to 0% if hotend temp is bellow 50c and fan speed is 21%
    {% endif %}
