# Trimmed snapshot of the live printer.cfg of the Trident (Moonraker GET
# http://trident.local:7125/server/files/config/printer.cfg on 2026-10-19).
# Only the sections tests/sim_macros.py uses, copied verbatim (file lines 440-444).

[gcode_macro CPAP_FLAP]
description: Toolhead share of the CPAP air. CPAP_FLAP PERCENT=0-100 (100 = all air to toolhead)
gcode:
    {% set pct = params.PERCENT|default(100)|float %}
    SET_SERVO SERVO=cpap_flap ANGLE={100 - pct}
